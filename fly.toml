# One small machine with the SQLite database on a volume.
# Pick your own app name (it becomes <name>.fly.dev) before `fly launch`.
app = "guildhall-change-me"
primary_region = "yyz"

[env]
  DATABASE_URL = "file:/data/guild.db"
  PORT = "3000"

[mounts]
  source = "guild_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Kept running: Discord gives a slash command three seconds to answer,
  # which a machine waking from sleep can miss.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
